databaseChangeLog:
  - changeSet:
      id: 001-1
      author: Fazil07-M
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: surname
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: gender_id
                  type: INTEGER
                  constraints:
                    nullable: false
  
  - changeSet:
      id: 001-2
      author: Fazil07-M
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: passports
      changes:
        - createTable:
            tableName: passports
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column: 
                  name: serial_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true

              - column: 
                  name: country
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                  
              - column: 
                  name: issue_date
                  type: DATE
                  constraints:
                    nullable: false

              - column: 
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true      
                  
  - changeSet:
      id: 001-3
      author: Fazil07-M
      changes:
        - addForeignKeyConstraint:
            baseTableName: passports
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_passport_user
  - changeSet:
      id: 001-4
      author: Fazil07-M
      changes:
        - sql:
            sql: ALTER TABLE users ADD CONSTRAINT chk_users_gender CHECK (gender_id IN (1, 2));
      rollback:
        - sql:
            sql: ALTER TABLE users DROP CONSTRAINT chk_users_gender;