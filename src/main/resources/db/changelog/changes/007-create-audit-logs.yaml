databaseChangeLog:

  # 007-1: Audit logs cedvelinin yaradılması
  - changeSet:
      id: 007-1
      author: Fazil07-M
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: audit_logs
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: entity_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: entity_id
                  type: BIGINT

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: message
                  type: VARCHAR(500)

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  # 007-2: Audit status ucun CHECK mehdudiyyeti
  - changeSet:
      id: 007-2
      author: Fazil07-M
      changes:
        - sql:
            sql: ALTER TABLE audit_logs ADD CONSTRAINT chk_audit_status CHECK (status IN ('SUCCESS', 'FAILED'));
      rollback:
        - sql:
            sql: ALTER TABLE audit_logs DROP CONSTRAINT chk_audit_status;