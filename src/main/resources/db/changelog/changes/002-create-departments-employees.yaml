
databaseChangeLog:

  # 002-1: Departments cedvelinin yaradılması
  - changeSet:
      id: 002-1
      author: Fazil07-M
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: departments
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: location
                  type: VARCHAR(100)

              - column:
                  name: phone
                  type: VARCHAR(20)

  # 002-2: Employees cedvelinin yaradılması
  - changeSet:
      id: 002-2
      author: Fazil07-M
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: employees
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: surname
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: salary
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: department_id
                  type: BIGINT
                  constraints:
                    nullable: false

  # 002-3: Employee ve Department arasinda xarici acar
  - changeSet:
      id: 002-3
      author: Fazil07-M
      changes:
        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_employee_department

  # 002-4: Maas ucun CHECK mehdudiyyeti
  - changeSet:
      id: 002-4
      author: Fazil07-M
      changes:
        - sql:
            sql: ALTER TABLE employees ADD CONSTRAINT chk_employee_salary CHECK (salary > 0);
      rollback:
        - sql:
            sql: ALTER TABLE employees DROP CONSTRAINT chk_employee_salary;
