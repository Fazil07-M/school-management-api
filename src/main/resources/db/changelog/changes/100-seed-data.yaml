  # 100-9: Identity sequence-lerin sinxronlasdirilmasi
  - changeSet:
      id: 100-9
      author: Fazil07-M
      context: dev
      changes:
        - sql:
            sql: |
              SELECT setval(pg_get_serial_sequence('departments', 'id'), (SELECT MAX(id) FROM departments));
              SELECT setval(pg_get_serial_sequence('employees', 'id'), (SELECT MAX(id) FROM employees));
              SELECT setval(pg_get_serial_sequence('courses', 'id'), (SELECT MAX(id) FROM courses));
              SELECT setval(pg_get_serial_sequence('students', 'id'), (SELECT MAX(id) FROM students));
              SELECT setval(pg_get_serial_sequence('authors', 'id'), (SELECT MAX(id) FROM authors));
              SELECT setval(pg_get_serial_sequence('books', 'id'), (SELECT MAX(id) FROM books));
              SELECT setval(pg_get_serial_sequence('author_book', 'id'), (SELECT MAX(id) FROM author_book));

      rollback:
        - sql:
            sql: |
              SELECT setval(pg_get_serial_sequence('departments', 'id'), 1, false);
              SELECT setval(pg_get_serial_sequence('employees', 'id'), 1, false);
              SELECT setval(pg_get_serial_sequence('courses', 'id'), 1, false);
              SELECT setval(pg_get_serial_sequence('students', 'id'), 1, false);
              SELECT setval(pg_get_serial_sequence('authors', 'id'), 1, false);
              SELECT setval(pg_get_serial_sequence('books', 'id'), 1, false);
              SELECT setval(pg_get_serial_sequence('author_book', 'id'), 1, false);              